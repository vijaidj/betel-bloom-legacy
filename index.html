<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Theme & PWA -->
    <meta name="theme-color" content="#0a2814" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VetriLeaf" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Geo -->
    <meta name="author" content="Sri Sholavandan Heritage Vetrilai" />
    <meta name="geo.region" content="IN-TN" />
    <meta name="geo.placename" content="Sholavandan, Madurai, Tamil Nadu" />
    <meta name="geo.position" content="9.93;77.88" />
    <meta name="ICBM" content="9.93, 77.88" />

    <!--
      Title, description, canonical, OpenGraph, Twitter and JSON-LD are injected
      per route by src/components/Seo.tsx. Do not add them here or every page
      will render duplicates.
    -->

    <!-- Google Analytics GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-04W3YSGFTP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-04W3YSGFTP');

      document.addEventListener('click', function (e) {
        var w = e.target.closest && e.target.closest('a[href*="wa.me"]');
        if (w) gtag('event', 'whatsapp_click', {
          event_category: 'engagement',
          event_label: (w.textContent || '').trim().substring(0, 50),
          page_path: window.location.pathname
        });
        var t = e.target.closest && e.target.closest('a[href^="tel:"]');
        if (t) gtag('event', 'phone_call_click', {
          event_category: 'engagement',
          page_path: window.location.pathname
        });
      });
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
